
name: Python checks

on:
  push:
    branches: [main, feature-update, improvement]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка pytest
        run: python -m pip install pytest

      - name: Проверка синтаксиса
        run: python -m compileall -q .

      - name: Запуск тестов
        run: python -m pytest -v

      - name: Запуск программы
        run: python main.py
