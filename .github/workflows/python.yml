name: Python checks

on:
  push:
    branches: [main, feature-update]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка синтаксиса
        run: python -m compileall -q main.py validators.py report.py storage.py

      - name: Запуск программы
        run: python main.py